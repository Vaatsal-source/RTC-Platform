name: CI

# PR → Lint → Typecheck → Test → Build → (E2E) → Merge,   then on main: Docker build → (push)

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: Chat-Platform # the monorepo lives in a sub-folder of this git repo

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: Chat-Platform/package.json # pins pnpm via "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Chat-Platform/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: End-to-end (api + 2× websocket + worker)
    runs-on: ubuntu-latest
    needs: verify
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NODE_ENV: development
      MONGO_URI: mongodb://127.0.0.1:27017/syncgrid
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only
      UPLOAD_DIR: /tmp/syncgrid-uploads
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: Chat-Platform/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Chat-Platform/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Start services
        run: |
          mkdir -p "$UPLOAD_DIR" .logs
          pnpm --filter @repo/api start > .logs/api.log 2>&1 &
          pnpm --filter @repo/websocket start > .logs/ws1.log 2>&1 &
          WS_PORT=8082 INSTANCE_ID=ws-b pnpm --filter @repo/websocket start > .logs/ws2.log 2>&1 &
          pnpm --filter @repo/worker start > .logs/worker.log 2>&1 &
          wait_for() {
            for _ in $(seq 1 40); do
              if curl -fs "$1" >/dev/null; then return 0; fi
              sleep 1
            done
            echo "::error::$1 never became healthy"
            tail -n 40 .logs/*.log
            return 1
          }
          for url in http://localhost:5000/health http://localhost:8080/health http://localhost:8082/health http://localhost:9102/health; do
            wait_for "$url"
          done
      - run: pnpm e2e
      - name: Service logs
        if: failure()
        run: tail -n 80 .logs/*.log

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [verify, e2e]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { name: api, file: Dockerfile, entry: src/server.ts }
          - { name: websocket, file: Dockerfile, entry: src/index.ts }
          - { name: worker, file: Dockerfile, entry: src/index.ts }
          - { name: web, file: apps/web/Dockerfile, entry: '' }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Deploy step: set the repository variable PUSH_IMAGES=true to publish to GHCR on merges to main.
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PUSH_IMAGES == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: Chat-Platform
          file: Chat-Platform/${{ matrix.file }}
          target: ${{ matrix.name != 'web' && 'service' || '' }}
          build-args: |
            APP=${{ matrix.name }}
            ENTRY=${{ matrix.entry }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PUSH_IMAGES == 'true' }}
          tags: ghcr.io/${{ github.repository }}/syncgrid-${{ matrix.name }}:latest,ghcr.io/${{ github.repository }}/syncgrid-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
