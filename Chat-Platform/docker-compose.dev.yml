# Infrastructure only — run the apps on the host with `pnpm dev`.
#   pnpm infra:up      start MongoDB + Redis (+ Redis Commander on :8081)
#   pnpm infra:down
services:
  mongodb:
    image: mongo:7
    container_name: syncgrid_dev_mongo
    ports:
      - '27017:27017'
    volumes:
      - mongo_dev_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: syncgrid_dev_redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  redis-commander:
    image: rediscommander/redis-commander
    container_name: syncgrid_dev_redis_ui
    ports:
      - '8081:8081'
    environment:
      - REDIS_HOSTS=local:redis:6379
    depends_on:
      - redis

volumes:
  mongo_dev_data:
