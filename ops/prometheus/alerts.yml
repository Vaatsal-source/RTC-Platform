# Alert rules (evaluated by Prometheus; visible at :9090/alerts).
# To get notified, point Prometheus at an Alertmanager or recreate these as Grafana alerts.
groups:
  - name: syncgrid
    rules:
      - alert: HighErrorRate
        expr: |
          sum(rate(api_http_request_duration_seconds_count{status=~"5.."}[5m]))
            / clamp_min(sum(rate(api_http_request_duration_seconds_count[5m])), 1) > 0.05
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: 'More than 5% of API requests are failing with 5xx'

      - alert: QueueBacklog
        expr: queue_jobs{state="waiting"} > 100
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: 'Queue {{ $labels.queue }} has {{ $value }} waiting jobs — are workers running?'

      - alert: FailedJobsGrowing
        expr: increase(queue_jobs{state="failed"}[15m]) > 20
        labels: { severity: warning }
        annotations:
          summary: 'Queue {{ $labels.queue }} is accumulating failed jobs'

      - alert: MemorySpike
        expr: '{__name__=~"(api|ws|worker)_process_resident_memory_bytes"} > 800 * 1024 * 1024'
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: '{{ $labels.job }} is using more than 800MB of memory'

      - alert: NoWebSocketConnections
        expr: sum(ws_connections) == 0
        for: 15m
        labels: { severity: info }
        annotations:
          summary: 'No WebSocket clients connected for 15 minutes'

      - alert: TargetDown
        expr: up == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: '{{ $labels.job }} is down'
