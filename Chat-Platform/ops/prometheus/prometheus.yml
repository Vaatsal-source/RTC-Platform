global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    static_configs: [{ targets: ['api:5000'] }]
  - job_name: websocket
    static_configs: [{ targets: ['websocket:8080'] }] # add 'websocket-2:8080' when using --profile scale
  - job_name: worker
    static_configs: [{ targets: ['worker:9102'] }] # includes queue_jobs{queue,state}
  - job_name: redis
    static_configs: [{ targets: ['redis-exporter:9121'] }]
