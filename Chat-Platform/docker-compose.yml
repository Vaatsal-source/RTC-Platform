# Full production-like stack:   docker compose up --build
#   plain:  frontend → http://localhost:3000   api → :5000   websocket → :8080
#   proxy:  everything on ONE origin via Caddy (HTTPS automatically when DOMAIN is a real domain) — see docs/DEPLOYMENT.md
#
# Optional profiles (combine freely):
#   --profile proxy          Caddy reverse proxy: /api → api, /ws → websocket, / → frontend  (needs DOMAIN)
#   --profile tunnel         Cloudflare Tunnel: free public HTTPS/WSS with no open ports (needs TUNNEL_TOKEN, use with proxy)
#   --profile scale          a 2nd WebSocket instance (proves Redis Pub/Sub fan-out)
#   --profile observability  Prometheus + Grafana (+ Redis exporter), bound to localhost
#   --profile alerts         Alertmanager → Discord (see ops/alertmanager/)
#   --profile backup         daily MongoDB dumps into ./backups (7 days kept)
#
# Required in .env (see .env.example):  JWT_SECRET, MONGO_PASSWORD, REDIS_PASSWORD, GRAFANA_PASSWORD (if observability)
# Use hex secrets (`openssl rand -hex 24`) so they are safe inside connection URLs.

name: syncgrid

x-service-env: &service-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  MONGO_URI: mongodb://${MONGO_USER:-syncgrid}:${MONGO_PASSWORD:?Set MONGO_PASSWORD in .env}@mongodb:27017/syncgrid?authSource=admin
  REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (32+ random characters) in .env}
  CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
  APP_URL: ${APP_URL:-http://localhost:3000}

x-service-build: &service-build
  context: .
  dockerfile: Dockerfile
  target: service

services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-syncgrid}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Set MONGO_PASSWORD in .env}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD-SHELL', 'mongosh --quiet -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand(''ping'').ok" | grep -q 1']
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Password from the environment (not the command line); AOF so BullMQ jobs survive a restart.
    command: ['sh', '-c', 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      <<: *service-build
      args: { APP: api, ENTRY: src/server.ts }
    restart: unless-stopped
    environment:
      <<: *service-env
      API_PORT: 5000
      TRUST_PROXY: ${TRUST_PROXY:-0} # set 1 behind Caddy/Cloudflare so rate limits see real client IPs
      UPLOAD_DIR: /data/uploads
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
    ports: ['${BIND_ADDR:-0.0.0.0}:5000:5000']
    volumes:
      - uploads:/data/uploads
    depends_on:
      mongodb: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:5000/health']
      interval: 10s
      timeout: 3s
      retries: 6

  websocket:
    build:
      <<: *service-build
      args: { APP: websocket, ENTRY: src/index.ts }
    restart: unless-stopped
    environment:
      <<: *service-env
      WS_PORT: 8080
      INSTANCE_ID: ws-1
    ports: ['${BIND_ADDR:-0.0.0.0}:8080:8080']
    depends_on:
      mongodb: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/health']
      interval: 10s
      timeout: 3s
      retries: 6

  websocket-2:
    profiles: [scale]
    build:
      <<: *service-build
      args: { APP: websocket, ENTRY: src/index.ts }
    restart: unless-stopped
    environment:
      <<: *service-env
      WS_PORT: 8080
      INSTANCE_ID: ws-2
    ports: ['${BIND_ADDR:-0.0.0.0}:8082:8080']
    depends_on:
      mongodb: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build:
      <<: *service-build
      args: { APP: worker, ENTRY: src/index.ts }
    restart: unless-stopped
    environment:
      <<: *service-env
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-SyncGrid <no-reply@syncgrid.local>}
      WORKER_METRICS_PORT: 9102
    depends_on:
      mongodb: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:9102/health']
      interval: 10s
      timeout: 3s
      retries: 6

  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Baked into the bundle at build time. Behind the proxy use VITE_API_URL=/api and VITE_WS_URL=/ws.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8080}
    restart: unless-stopped
    ports: ['${BIND_ADDR:-0.0.0.0}:3000:80']
    depends_on: [api, websocket]

  # ── Reverse proxy / TLS (optional) ────────────────────────────────────────
  caddy:
    profiles: [proxy]
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN (e.g. chat.example.com, or :80 behind a tunnel / another TLS terminator)}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./ops/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [frontend, api, websocket]

  cloudflared:
    profiles: [tunnel]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Create a tunnel in Cloudflare Zero Trust and paste its token into .env}
    depends_on: [caddy]

  # ── Backups (optional) ────────────────────────────────────────────────────
  backup:
    profiles: [backup]
    image: mongo:7
    restart: unless-stopped
    entrypoint: ['sh', '-c']
    command:
      - |
        while true; do
          f=/backups/syncgrid-$$(date +%Y%m%d-%H%M%S).gz
          mongodump --uri="$$MONGO_URI" --archive="$$f" --gzip && echo "backup written: $$f"
          find /backups -name 'syncgrid-*.gz' -mtime +$${BACKUP_KEEP_DAYS:-7} -delete
          sleep $${BACKUP_INTERVAL_SECONDS:-86400}
        done
    environment:
      MONGO_URI: mongodb://${MONGO_USER:-syncgrid}:${MONGO_PASSWORD:?Set MONGO_PASSWORD in .env}@mongodb:27017/syncgrid?authSource=admin
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./backups:/backups
    depends_on:
      mongodb: { condition: service_healthy }

  # ── Observability (optional) — bound to localhost, never public ───────────
  prometheus:
    profiles: [observability]
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ['127.0.0.1:9090:9090']
    depends_on: [api, websocket, worker]

  redis-exporter:
    profiles: [observability]
    image: oliver006/redis_exporter:v1.66.0
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    depends_on:
      redis: { condition: service_healthy }

  grafana:
    profiles: [observability]
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ['127.0.0.1:3001:3000']
    depends_on: [prometheus]

  alertmanager:
    profiles: [alerts]
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    volumes:
      - ./ops/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./ops/alertmanager/discord_webhook_url:/etc/alertmanager/discord_webhook_url:ro
    ports: ['127.0.0.1:9093:9093']

volumes:
  mongo_data:
  redis_data:
  uploads:
  caddy_data:
  caddy_config:
